services:
  - type: web
    name: webdesk-remote-signaling
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Add WEBDESK_WORKSPACE_TOKEN in the Render dashboard if you want an
      # extra secret. Never place its value in this repository.
      - key: WEBDESK_SUPPORT_TTL
        value: "300"
      - key: WEBDESK_ICE_SERVERS_JSON
        value: '[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]'
